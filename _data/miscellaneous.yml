sports:
  intro: >
    I love sport in all its forms: bench press and pull-ups, rackets and
    courts, slopes and pools, bows and horses.
  team_note: >
    For now, my sporting life is pleasantly atomized—a workout here, a rally
    there. If your team is building something bigger, I would be glad to join
    and meet people who love sport as much as I do.
