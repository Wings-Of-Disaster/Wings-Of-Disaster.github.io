hero:
  eyebrow: "MISCELLANEOUS / VOL. 01"
  title_lead: "I lift. I game."
  title_accent: "I collect world titles."
  intro: >
    Research is the main quest, not the whole map. Outside the lab, I train,
    explore impossible worlds, and take esports legends at their word.

