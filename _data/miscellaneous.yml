hero:
  eyebrow: "OFF THE CLOCK"
  title_lead: "I lift. I game."
  title_accent: "I collect world titles."
  intro: >
    Research is the main quest, not the whole map. Outside the lab, I train,
    explore impossible worlds, and take esports legends at their word.
  video_src: "/assets/video/pexels-engin-akyurt-6069112-960x540-30fps.mp4"
  video_label: "NOW PLAYING"
  video_title: "The training arc"

interests:
  - "Strength training"
  - "Elden Ring"
  - "League of Legends"
  - "Counter-Strike"

stories:
  - theme: "fitness"
    icon: "fa-solid fa-dumbbell"
    label: "FITNESS"
    title: "Built in the gym."
    body: >
      Progressive overload in the gym; unreasonable persistence everywhere
      else. One more rep is usually the right answer.
    note: "Strength · Conditioning · Consistency"

  - theme: "elden"
    icon: "fa-solid fa-crown"
    label: "ELDEN RING"
    title: "Elden Lord."
    body: >
      I crossed the fog, challenged the demigods, and claimed the throne.
      Reviewer two remains the harder boss.
    note: "Great Runes · Crown secured · NG+"

  - theme: "worlds"
    icon: "fa-solid fa-trophy"
    label: "LEAGUE OF LEGENDS"
    title: "World Champion."
    body: >
      Faker said the fifth trophy was for those who believed in T1 no matter
      what. I believed. That sounds official enough to me.
    link_label: "Watch the handover"
    link_url: "https://www.youtube.com/watch?v=SuwPaNAZlF0"

  - theme: "major"
    icon: "fa-solid fa-crosshairs"
    label: "COUNTER-STRIKE"
    title: "Major Champion."
    body: >
      NiKo said I would get it. The Major trophy now lives on my shelf; the
      clutch gene is still in transit.
    link_label: "Hear it from NiKo"
    link_url: "https://www.twitch.tv/eslcs/clip/ClearOilyPanPogChamp-GMTGwClWAkF5XjQX"

videos:
