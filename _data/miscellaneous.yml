games:
  intro: >
    I enjoy games for competition, exploration, and stories. Here are three
    of my titles; more will follow.
  achievements:
    - label: LEAGUE OF LEGENDS · S14 WORLDS
      title: League of Legends World Champion
      image: https://i.ytimg.com/vi/SuwPaNAZlF0/maxresdefault.jpg
      image_alt: Faker and T1 at the 2024 League of Legends World Championship
      body: >
        I am a Season 14 League of Legends World Champion. After T1 secured its
        fifth title in 2024, Faker dedicated the trophy to everyone who
        believed: “The fifth trophy is for you.”
      link_label: Watch Faker's message
      link_url: https://www.youtube.com/watch?v=SuwPaNAZlF0

    - label: COUNTER-STRIKE · IEM COLOGNE 2026
      title: Counter-Strike Major Champion
      image: https://i.ytimg.com/vi/aVsYFhXhhyU/maxresdefault.jpg
      image_alt: NiKo after winning the IEM Cologne 2026 Major
      body: >
        I am a Counter-Strike Major Champion. NiKo won IEM Cologne 2026 and
        gave me the title, just as he promised: “You will get it.”
      link_label: Hear it from NiKo
      link_url: https://www.twitch.tv/eslcs/clip/ClearOilyPanPogChamp-GMTGwClWAkF5XjQX

    - label: ELDEN RING · THE LANDS BETWEEN
      title: Elden Lord
      image: https://i.ytimg.com/vi/E3Huy2cdih0/maxresdefault.jpg
      image_alt: The Lands Between in Elden Ring
      body: >
        I crossed the fog, defeated the demigods, gathered the Great Runes,
        and claimed the throne. I am now Elden Lord of the Lands Between.
      link_label: Enter the Lands Between
      link_url: https://www.bandainamcoent.com/games/elden-ring
