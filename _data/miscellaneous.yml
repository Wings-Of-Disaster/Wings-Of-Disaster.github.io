sports:
  intro: >
    I love sport in almost every form. In the gym, I especially enjoy the
    bench press and pull-ups; elsewhere, I am usually happy whenever there is
    a racket, ball, slope, pool, target, or horse involved.
  team_note: >
    My sporting life is still a little atomized: a workout here, a rally there,
    and the occasional new sport in between. If your team needs one more
    person to do something bigger, I would be happy to join—and happier still
    to meet people who simply enjoy moving together.
  activities:
